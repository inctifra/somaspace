repos:

# -------------------------
# Python (Django backend)
# -------------------------
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.15.6
  hooks:
    - id: ruff
      name: ruff-backend
      args: [--fix]
      files: ^backend/

    - id: ruff-format
      name: ruff-format-backend
      files: ^backend/


- repo: https://github.com/pre-commit/mirrors-mypy
  rev: v1.10.0
  hooks:
    - id: mypy
      name: mypy-backend
      entry: bash -c "PYTHONPATH=backend uv run mypy --config-file backend/pyproject.toml"
      pass_filenames: false
      files: ^backend/


# -------------------------
# React / Frontend
# -------------------------
- repo: https://github.com/pre-commit/mirrors-eslint
  rev: v9.7.0
  hooks:
    - id: eslint
      name: eslint-web
      files: ^web/.*\.(js|ts|tsx)$


- repo: https://github.com/pre-commit/mirrors-prettier
  rev: v2.1.0
  hooks:
    - id: prettier
      name: prettier-web
      files: ^web/


# -------------------------
# General repo hygiene
# -------------------------
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.6.0
  hooks:
    - id: trailing-whitespace
    - id: end-of-file-fixer
    - id: check-merge-conflict
    - id: check-yaml
    - id: check-json
